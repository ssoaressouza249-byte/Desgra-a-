name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP" -d tmp
            DIR=$(find tmp -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -f "$DIR/settings.gradle.kts" ]; then
              cp -rf "$DIR"/. .
            else
              cp -rf tmp/. .
            fi
            rm -rf tmp "$ZIP"
          fi
          sed -i 's/libs\.androidx\.ui/libs.androidx.compose.ui/g; s/libs\.androidx\.material3/libs.androidx.compose.material3/g' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Sanx-Vip
          path: app/build/outputs/apk/debug/app-debug.apk
          
